name: core

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        run: |
          mkdir -p build
          javac -Werror -Xlint:all -d build $(find core/src core/test -name '*.java')

      - name: Run the checks
        run: java -cp build works.jmc.scankite.Tests

  live:
    # Reads the real public pools. Allowed to fail: it depends on other people's
    # servers, and a red tick because somebody moved a file teaches nobody anything.
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mkdir -p build
          javac -d build $(find core/src core/tools -name '*.java')
          java -cp build works.jmc.scankite.LiveCheck
